[package]
name = "git-review-gpui"
version = "0.1.0"
edition = "2021"
description = "A GitHub-style git code review desktop app, built with GPUI (Zed's GPU UI framework)"

[[bin]]
name = "git-review-gpui"
path = "src/main.rs"

[dependencies]
# GPUI is Zed's GPU-accelerated UI framework. Zed publishes an official, usable
# snapshot to crates.io as `gpui` (currently 0.2.2), which is cleaner to pin than a
# raw git revision. The API was verified against this exact published source.
gpui = "0.2.2"
git2 = "0.20"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = "0.5"
jiff = "0.2"
# System light/dark theme detection (SPEC.md "Visual style & theme").
dark-light = "2"

[profile.dev]
opt-level = 1

# Size-optimised release profile (SPEC.md "Release build (optimise for size)").
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
