[package]
name = "git-review-dioxus"
version = "0.1.0"
edition = "2021"
description = "A GitHub-style git code review desktop app, built with Dioxus"

[[bin]]
name = "git-review-dioxus"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
git2 = "0.20"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = "0.5"
jiff = "0.2"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
