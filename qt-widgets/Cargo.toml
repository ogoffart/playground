[package]
name = "git-review-qtwidgets"
version = "0.1.0"
edition = "2021"
description = "A GitHub-style git code review desktop app, built with Qt Widgets (Qt6) driven from Rust via a C++ shim"

[[bin]]
name = "git-review-qtwidgets"
path = "src/main.rs"

[dependencies]
git2 = "0.20"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = "0.5"
jiff = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }

[profile.dev]
opt-level = 1
