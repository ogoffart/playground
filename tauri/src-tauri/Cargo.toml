[package]
name = "git-review-tauri"
version = "0.1.0"
edition = "2021"
description = "A GitHub-style git code review desktop app, built with Tauri"

[lib]
name = "git_review_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "git-review-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.20"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = "0.5"
jiff = "0.2"

[profile.dev]
opt-level = 1
