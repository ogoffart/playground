[package]
name = "git-review-cxxqt"
version = "0.1.0"
edition = "2021"
description = "A GitHub-style git code review desktop app, built with cxx-qt (KDAB's Qt/Rust bridge)"

[[bin]]
name = "git-review-cxxqt"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_full"] }
git2 = "0.20"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = "0.5"
jiff = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[build-dependencies]
cxx-qt-build = "0.7"

[profile.dev]
opt-level = 1
